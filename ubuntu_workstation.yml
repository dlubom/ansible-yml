---
- name: Setup ubuntu workstation
  hosts: localhost
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    # Developer tools
    - name: Install Git
      apt:
        name: git
        state: present

    - name: Install VS Code dependencies
      apt:
        name:
          - apt-transport-https
          - wget
          - gpg
        state: present

    - name: Add VS Code repository key
      apt_key:
        url: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Add VS Code repository
      apt_repository:
        repo: deb [arch=amd64] https://packages.microsoft.com/repos/vscode stable main
        state: present
        filename: vscode

    - name: Install VS Code
      apt:
        name: code
        state: present
        update_cache: yes

    - name: Install Neovim
      apt:
        name: neovim
        state: present

    - name: Install jq
      apt:
        name: jq
        state: present

    # Install C/C++ build tools
    - name: Install build-essential for C/C++
      apt:
        name: build-essential
        state: present

    # Install Scala
    - name: Install OpenJDK (Scala dependency)
      apt:
        name: default-jdk
        state: present

    - name: Remove default Scala if exists
      apt:
        name: scala
        state: absent
      
    - name: Download Scala 2.13 (compatible with Apache Spark 3.5+)
      get_url:
        url: "https://downloads.lightbend.com/scala/2.13.10/scala-2.13.10.deb"
        dest: /tmp/scala.deb
        mode: '0644'

    - name: Install Scala 2.13
      apt:
        deb: /tmp/scala.deb
        state: present

    # Install IntelliJ IDEA Community Edition
    - name: Download IntelliJ IDEA Community Edition
      get_url:
        url: "https://download.jetbrains.com/product?code=IIC&latest&distribution=linux" # Use stable redirect URL for latest community edition
        dest: /tmp/ideaIC.tar.gz
        mode: '0644'

    - name: Create IntelliJ IDEA installation directory
      file:
        path: /opt/idea
        state: directory
        mode: '0755'

    - name: Extract IntelliJ IDEA
      unarchive:
        src: /tmp/ideaIC.tar.gz
        dest: /opt/idea
        extra_opts: [--strip-components=1] # Remove the top-level directory from the archive
        remote_src: yes

    - name: Create symbolic link for IntelliJ IDEA executable
      file:
        src: /opt/idea/bin/idea.sh
        dest: /usr/local/bin/idea
        state: link

    # Install Go
    - name: Download Go binary
      get_url:
        url: "https://golang.org/dl/go1.24.2.linux-amd64.tar.gz" # Check for the latest version
        dest: /tmp/go.tar.gz
        mode: '0644'

    - name: Remove previous Go installation if exists
      file:
        path: /usr/local/go
        state: absent

    - name: Extract Go binary
      unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: yes

    - name: Add Go to system PATH
      copy:
        content: 'export PATH=$PATH:/usr/local/go/bin'
        dest: /etc/profile.d/golang.sh
        mode: '0644'

    # Install Rust
    - name: Download rustup installer script
      get_url:
        url: https://sh.rustup.rs
        dest: /tmp/rustup.sh
        mode: '0755'

    - name: Install Rust via rustup (non-interactive)
      shell: /tmp/rustup.sh -y --no-modify-path
      args:
        creates: "{{ ansible_env.HOME }}/.cargo/bin/rustc" # Check if rustc exists in the default cargo home

    - name: Add Rust (Cargo) to system PATH
      copy:
        content: 'export PATH="$HOME/.cargo/bin:$PATH"'
        dest: /etc/profile.d/rustlang.sh
        mode: '0644'

    - name: Create directory for DuckDB
      file:
        path: /opt/duckdb
        state: directory
        mode: '0755'

    - name: Download DuckDB
      get_url:
        url: https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip # Check for the latest version
        dest: /tmp/duckdb.zip
        mode: '0644'

    - name: Unzip DuckDB
      unarchive:
        src: /tmp/duckdb.zip
        dest: /opt/duckdb
        remote_src: yes

    - name: Create symbolic link for DuckDB
      file:
        src: /opt/duckdb/duckdb
        dest: /usr/local/bin/duckdb
        state: link

    - name: Download Miniconda installer
      get_url:
        url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
        dest: /tmp/miniconda.sh
        mode: '0755'

    - name: Install Miniconda silently
      shell: /tmp/miniconda.sh -b -p /opt/miniconda
      args:
        creates: /opt/miniconda

    - name: Add Miniconda to system PATH
      copy:
        content: 'export PATH="/opt/miniconda/bin:$PATH"'
        dest: /etc/profile.d/miniconda.sh
        mode: '0644'

    - name: Install Mamba via Conda
      shell: |
        source /opt/miniconda/bin/activate
        conda install -y -c conda-forge mamba
      args:
        executable: /bin/bash

    # Docker installation
    - name: Install Docker dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Get Ubuntu distribution codename
      command: lsb_release -cs
      register: ubuntu_codename
      changed_when: false

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes

    - name: Create Docker config directory
      file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker daemon to use systemd
      copy:
        content: |
          {
            "exec-opts": ["native.cgroupdriver=systemd"],
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "100m"
            },
            "storage-driver": "overlay2"
          }
        dest: /etc/docker/daemon.json
        mode: '0644'

    - name: Restart Docker service
      systemd:
        name: docker
        state: restarted
        enabled: yes
        daemon_reload: yes

    # VirtualBox installation
    - name: Install VirtualBox dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - wget
          - gnupg
          - software-properties-common
        state: present

    - name: Add VirtualBox repository key
      apt_key:
        url: https://www.virtualbox.org/download/oracle_vbox_2016.asc
        state: present

    - name: Add VirtualBox repository
      apt_repository:
        repo: deb [arch=amd64] https://download.virtualbox.org/virtualbox/debian {{ ubuntu_codename.stdout }} contrib
        state: present
        filename: virtualbox

    - name: Install VirtualBox
      apt:
        name: virtualbox-7.0
        state: present
        update_cache: yes

    - name: Add current user to vboxusers group
      user:
        name: "{{ ansible_user_id }}"
        groups: vboxusers
        append: yes

    - name: Install Kitty terminal emulator
      shell: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
      args:
        executable: /bin/bash

    - name: Install tmux
      apt:
        name: tmux
        state: present

    - name: Install fish shell
      apt:
        name: fish
        state: present

    - name: Install Survex
      apt:
        name: survex
        state: present
    
    - name: Install fzf
      apt:
        name: fzf
        state: present

    # Install kubectl
    - name: Install kubectl dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes public signing key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
        dest: /tmp/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes GPG key
      shell: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg # Avoid re-downloading/processing if key exists

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes-release # Use a descriptive filename

    - name: Install kubectl
      apt:
        name: kubectl
        state: present
        update_cache: yes

    - name: Change shell to fish
      user: # Use the user module for changing the shell idempotently
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/fish
      become: yes # Need become to change shell for other users if needed, or the target user itself
